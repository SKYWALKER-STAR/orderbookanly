[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbookanly"
version = "0.1.0"
description = "Predict.fun order book collection, snapshots and analysis"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16", "redis>=5,<7", "clickhouse-connect>=0.8,<1", "streamlit>=1.45,<2", "pandas>=2.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
orderbook = "orderbookanly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
