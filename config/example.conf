[predict]
market_ids = 3862211
websocket_url = wss://ws.predict.fun/ws
api_key_env = PREDICT_API_KEY
reconnect_seconds = 3
receive_timeout_seconds = 45

[redis]
url = redis://localhost:6379/0
prefix = predict
stream_maxlen = 10000

[clickhouse]
host = localhost
port = 8123
username = default
password_env = CLICKHOUSE_PASSWORD
secure = false
database = orderbook

[snapshot]
interval_seconds = 30

[analysis]
depth_levels = 5

[visualization]
refresh_seconds = 5
history_limit = 500
stale_seconds = 120

[logging]
level = INFO
format = %(asctime)s %(levelname)s %(name)s: %(message)s
date_format = %Y-%m-%d %H:%M:%S
file =
